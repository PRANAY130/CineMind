services:
  # ── CineMind Backend (FastAPI + Celery Worker combined) ────────────────────
  # Both processes run inside one container to stay within the free tier.
  # start.sh launches Celery in the background, then FastAPI in the foreground.
  - type: web
    name: cinemind-api
    env: docker
    plan: free
    autoDeploy: true
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # CMD in Dockerfile handles startup (start.sh) — no override needed
    envVars:
      - key: PORT
        value: 8000
      - key: CHROMA_DB_DIR
        value: /tmp/chroma
      # Firestore — base64 of firebase-adminsdk.json (set in Render dashboard)
      - key: FIREBASE_CERT_JSON
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      # NeonDB
      - key: NEON_DB_URL
        sync: false
      - key: NEON_JWKS_URL
        sync: false
      # Upstash Redis (Celery broker)
      - key: UPSTASH_REDIS_URL
        sync: false
      # Cloudflare R2 Storage
      - key: CLOUDFLARE_R2_ENDPOINT
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_SECRET_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET
        value: videoanalyser
      # AI Providers
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
